<!DOCTYPE html>
<html lang="en">
<body>
<div class="upload">
  <h1>Admin section to upload</h1>
  <input type="file" accept="image/jpeg" (change)="onFileSelected($event)" #fileUpload>
  <button (click)="upload(fileUpload)" [disabled]="!selectedFile()">Upload</button>
  <input type="password" (change)="onPasswordSet($event)">
</div>
</body>
</html>
