<div class="bgLetters">

  <svg class="videoMask"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet">

    <defs>
      <symbol id="letter-L">
        <path d="M0 0H130V580H260V700H0Z"/>
      </symbol>
      <symbol fill-rule="evenodd" id="letter-A">
        <path d="M0 700V95L95 0H245L340 95V700H212V470H128V700Z M128 130H212V350H128Z"/>
      </symbol>
      <symbol id="letter-N">
        <path d="M0 0H125L215 330V0H340V700H215L125 370V700H0Z"/>
      </symbol>
      <symbol id="letter-E">
        <path d="M0 0H260V120H130V270H240V390H130V580H260V700H0Z"/>
      </symbol>
      <symbol id="dash">
        <path d="M0 290H180V410H0Z"/>
      </symbol>
      <symbol id="letter-M">
        <path d="M0 0H130L220 280L310 0H440V700H315V330L250 540H190L125 330V700H0Z"/>
      </symbol>
      <symbol id="letter-R">
        <path fill-rule="evenodd" d="M0 0H200C270 0 320 40 320 110V230C320 285 295 325 255 340C295 355 320 390 320 450V700H195V470C195 450 190 440 170 440H125V700H0Z M125 120H170C190 120 195 130 195 150V290C195 310 190 320 170 320H125Z"/>
      </symbol>
      <symbol id="letter-T">
        <path d="M0 0H300V125H212V700H88V125H0Z"/>
      </symbol>
      <symbol id="letter-I">
        <path d="M0 0H140V700H0Z"/>
      </symbol>
    </defs>

    <svg class="desktopView"
      viewBox="0 0 3560 700">
      <mask id="desktopMask"
            maskUnits="userSpaceOnUse"
            x="0" y="0"
            width="3560" height="700"
            style="mask-type:luminance">

        <rect width="3560" height="700" fill="black"/>

        <g fill="white">

          <!-- Lane -->
          <use href="#letter-L" transform="translate(0 0)"/>
          <use href="#letter-A" transform="translate(290 0)"/>
          <use href="#letter-N" transform="translate(660 0)"/>
          <use href="#letter-E" transform="translate(1030 0)"/>

          <use href="#dash" transform="translate(1320 0)"/>

          <!--Martin-->
          <use href="#letter-M" transform="translate(1530 0)"/>
          <use href="#letter-A" transform="translate(2000 0)"/>
          <use href="#letter-R" transform="translate(2370 0)"/>
          <use href="#letter-T" transform="translate(2720 0)"/>
          <use href="#letter-I" transform="translate(3050 0)"/>
          <use href="#letter-N" transform="translate(3220 0)"/>
        </g>
      </mask>
      <foreignObject
        class="videoDesktop"
        x="0" y="0"
        width="3560" height="700"
        mask="url(#desktopMask)">

        <video xmlns="http://www.w3.org/1999/xhtml"
               autoplay [volume]="0" loop playsinline preload="auto"
               class="svgVideoD">

          <source src="/backgroundVid.webm" type="video/webm"/>
          <source src="/backgroundVid.mp4" type="video/mp4"/>

        </video>

      </foreignObject>
    </svg>

    <svg class="mobileView"
         viewBox="0 0 2030 1440"
         preserveAspectRatio="xMidYMid meet">

      <mask id="mobileMask"
            maskUnits="userSpaceOnUse"
            x="0" y="0"
            width="2030" height="1440">

        <rect width="2030" height="1440" fill="black"/>

        <g fill="white">

          <!-- LANE - -->
          <use href="#letter-L" transform="translate(380 0)"/>
          <use href="#letter-A" transform="translate(660 0)"/>
          <use href="#letter-N" transform="translate(1030 0)"/>
          <use href="#letter-E" transform="translate(1400 0)"/>

          <use href="#dash" transform="translate(1690 0)"/>

          <!-- MARTIN -->
          <use href="#letter-M" transform="translate(0 725)"/>
          <use href="#letter-A" transform="translate(470 725)"/>
          <use href="#letter-R" transform="translate(840 725)"/>
          <use href="#letter-T" transform="translate(1190 725)"/>
          <use href="#letter-I" transform="translate(1520 725)"/>
          <use href="#letter-N" transform="translate(1690 725)"/>

        </g>
      </mask>

      <foreignObject
        class="videoMobile"
        x="0" y="0"
        width="2030" height="1440"
        mask="url(#mobileMask)">

        <video xmlns="http://www.w3.org/1999/xhtml"
               autoplay [volume]="0" loop playsinline preload="auto"
               class="svgVideoM">

          <source src="/backgroundVid.webm" type="video/webm"/>
          <source src="/backgroundVid.mp4" type="video/mp4"/>

        </video>

      </foreignObject>

    </svg>

  </svg>

</div>


<header>
  <nav>
    <div>
      <a routerLink="/photos">Gallery</a>
    </div>
  </nav>
</header>

<main>

  <router-outlet />

</main>
